name: Bug report
description: Report a reproducible failure in a gate, receipt, report, or skill workflow.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping make contribution evidence more reliable.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened, and what should have happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the command and sanitized input shape. Never paste credentials or raw private logs.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Maintainer Mode version
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Linux, macOS, Windows, Other]
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed tokens, credentials, private repository data, and personal information.
          required: true
